name: drift
on:
  schedule:
    - cron: "0 17 * * *" # 02:00 JST, one hour before the maintain session
    - cron: "30 17 31 1 *" # 02:30 JST on 1 February: look for next year's fee tables
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: gh label create drift --color B4530A --force
      - name: Check sources
        if: github.event.schedule != '30 17 31 1 *'
        run: |
          if ./x drift > report.md; then exit 0; fi
          cat report.md
          if [ -z "$(gh issue list --label drift --state open --search 'in:title "maintain: sources changed"' --json number --jq '.[].number')" ]; then
            gh issue create --label drift --title "maintain: sources changed" --body-file report.md
          fi
      - name: Yearly fee table reminder
        if: github.event.schedule == '30 17 31 1 *'
        run: gh issue create --label drift --title "maintain: find next fiscal year's fee tables" --body "For every city under data/cities/, look for the fee table of the fiscal year that starts in April, and update hoikuryo.yaml and its saved source when it is published."
