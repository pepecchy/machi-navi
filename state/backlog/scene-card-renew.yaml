title: 場面「在留カードの有効期間を更新する」（永住者など）を足す
reason: 永住者（16 歳以上）と高度専門職 2 号の人は、在留カードの有効期間の満了日の 3 か月前から満了日までに更新を申請する（手数料なし）。16 歳で満了する在留カードは、16 歳の誕生日の 6 か月前から申請できる。出入国在留管理庁のページ（https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri10_00011.html）に文字で載っている。2026 年 6 月 14 日からの新しい在留カードとの違いは、作るときにページで確かめる
