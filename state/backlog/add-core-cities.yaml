title: 中核市を 1 つ足す
reason: 川口市、鹿児島市、岐阜市を足した。政令指定都市と東京都の市町村は、料金表が文字で取れて出典と一致する所を足し終えた（残りは画像、案、年度、出典の食い違い、取得の拒否で見送り）。次に人口が多いのは中核市なので、料金表が文字で載り、第 2 子の決まりが今の形（free・half・half10・half100・table）に収まる市から足す。中核市は市民税の税率が 6% のままなので、tax_adjust は要らない。船橋市は、上の 2 人がともに 3 歳未満で通うときだけ別の列（特例）になり、今の形で表せないため後に回す
