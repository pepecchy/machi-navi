title: 中核市を 1 つ足す
reason: 川口市、鹿児島市、岐阜市、西宮市、柏市、川越市、長野市、松本市、豊橋市、尼崎市、横須賀市、高知市、長崎市、旭川市、山形市、下関市、水戸市、函館市を足した。政令指定都市と東京都の市町村は、料金表が文字で取れて出典と一致する所を足し終えた（残りは画像、案、年度、出典の食い違い、取得の拒否で見送り）。次に人口が多いのは中核市なので、料金表が文字で載り、第 2 子の決まりが今の形（free・half・half10・half100・table）に収まる市から足す。中核市は市民税の税率が 6% のままなので、tax_adjust は要らない。船橋市は、上の 2 人がともに 3 歳未満で通うときだけ別の列（特例）になり、今の形で表せないため後に回す。豊中市は料金表が画像、吹田市は料金表が試算用の Excel だけ、東大阪市は 2 歳児クラスだけ無償で 0〜2 歳の 1 つの表に収まらないため見送った。高崎市は令和 8 年 10 月からの半額化とひとり親の列が重なり、前橋市は括弧の金額の意味が表から読めないため見送った。一宮市は第 2 子の扱いが所得で 3 通りに分かれ、大津市は施設の種類で金額が分かれ、宇都宮市・岡崎市・明石市・奈良市・枚方市・金沢市・高松市・松山市は料金表の取得をサイトが拒むため見送った。宮崎市は国の階層と市の階層が 1 つの表で入り組み、境目が読み取れないため後に回す。福島市は表の金額が給食の 1,000 円を引いた後のもので、第 2 子の半額を引く前と後のどちらに掛けるか資料から読めず、松江市は 11 階層以上で世帯の上限額が第 2 子を半額より下げ、呉市は 0〜2 歳が令和 8 年 10 月から無償だが市のサイトに転入届のページが無いため見送った。秋田市は第 1 子の無償化と県の助成に所得の条件があり、佐世保市は公開している表が令和 7 年度で 0 歳児だけ第 2 子が半額のため見送った。富山市・大分市・那覇市・高槻市・寝屋川市も料金表の取得をサイトが拒んだ。いわき市と福山市は料金表に年度が無く、甲府市は第 2 子が所得で無料と半額に分かれ、青森市と八尾市は 2 歳児クラスが無償で 0〜2 歳の 1 つの表に収まらず、盛岡市は公開している表が令和 9 年度のものだけ、福井市は表が令和 6 年 9 月のもの、和歌山市は第 2 子の扱いが階層と申請で分かれるため見送った
