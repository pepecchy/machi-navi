title: 場面「子どもが生まれた」を足す
reason: 一般の市の保育料は、料金表が文字で取れて令和 8 年度と書かれた市をほぼ足し終え、2026-11-19 の build では約 60 市を調べて 1 市しか足せなかった。次に住む人の役に立つのは、引っ越しに次いで手続きが多い出生の場面。出生届（生まれた日から 14 日以内）と児童手当の認定請求（出生日の翌日から 15 日以内）は全国共通の事実で、法務省とこども家庭庁のページを出典にできる。今ある data/national と scenes の形で載せられ、市ごとのデータは要らない。まず全国共通の 2 つの手続きだけの場面を足し、市ごとの窓口は転入のデータを使い回せるかを後で見る
