title: 東京都の市町村をもう 1 つ足す
reason: 東京都の保育所等利用世帯負担軽減事業で、令和 7 年 9 月から多くの市でも基本保育料が第 1 子から無償になった。三鷹市は「令和7年9月利用分以降は第1子も含めてすべての児童の保育料は無償」と書いている。区と同じく free_all で足せる。市のページで、きょうだいにかかわらず無償と確かめられた市だけを足す。三鷹市、武蔵野市、西東京市、立川市、小金井市、小平市、府中市、調布市、国立市、稲城市、東久留米市、羽村市、東大和市、清瀬市、多摩市、青梅市、あきる野市、福生市、八王子市、国分寺市、昭島市、狛江市、日の出町、瑞穂町、檜原村、奥多摩町、大島町、三宅村を足した。町村も、町村のページで全員無償と確かめられれば同じく足す。日野市と東村山市は、市のサイトがこの環境からの取得を拒むため、写しを取れず見送った。次の候補は町田市など
