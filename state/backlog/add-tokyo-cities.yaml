title: 東京都の市をもう 1 つ足す
reason: 東京都の保育所等利用世帯負担軽減事業で、令和 7 年 9 月から多くの市でも基本保育料が第 1 子から無償になった。三鷹市は「令和7年9月利用分以降は第1子も含めてすべての児童の保育料は無償」と書いている。区と同じく free_all で足せる。市のページで、きょうだいにかかわらず無償と確かめられた市だけを足す。三鷹市、武蔵野市、西東京市、立川市、小金井市、小平市、府中市、調布市、国立市、稲城市、東久留米市、羽村市、東大和市、清瀬市を足した。国分寺市は、見つかった無償の記述が定期利用保育事業のページのもので、認可保育所についてはまだ確かめていない。次の候補は国分寺市、八王子市、町田市など
