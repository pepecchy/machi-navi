title: 人口の多い一般市を 1 つ足す
reason: 政令指定都市、東京都の市町村、中核市は、料金表が文字で取れて出典と一致する所を足し終えた。次に住む人が多いのは、中核市でない人口の多い市（松戸市、市川市、藤沢市、所沢市、春日井市、四日市市など）なので、人口の多い順に、料金表が文字で載り、令和 8 年度と書かれ、第 2 子の決まりが今の形（free・free_same・half・half10・half100・table）に収まる市から足す。一般市も市民税の税率は 6% なので tax_adjust は要らない。見送った市と理由はこの reason に足していく。市川市を足した（令和 8 年 9 月から 0〜2 歳児の保育料が全員無償のため free_all）。守口市を足した（市独自に 0〜5 歳児の保育料が所得にかかわらず無料のため free_all）。松戸市と藤沢市は施設の種類で金額が分かれ、所沢市は公開している表が令和元年 10 月のもののため見送った。浦安市を足した（令和 8 年 4 月から 0〜2 歳児の保育料が全員無償のため free_all）。都城市を足した（市独自に 0〜2 歳児の保育料が全員無料のため free_all）。茨木市は料金表の PDF の文字が取れず、四日市市は料金表に年度が無く、春日井市は第 2 子が所得で無料と半額に分かれるため見送った。十和田市を足した（令和 8 年 4 月から 0〜2 歳児の保育料が全員無償のため free_all）。松浦市は無償化が令和 7 年 4 月からとあるだけで令和 8 年度の記載が無いため見送った。弘前市を足した（令和 8 年 4 月にさかのぼって 0〜5 歳児の保育料が全員無料のため free_all）
