title: 人口の多い一般市を 1 つ足す
reason: 政令指定都市、東京都の市町村、中核市は、料金表が文字で取れて出典と一致する所を足し終えた。次に住む人が多いのは、中核市でない人口の多い市（松戸市、市川市、藤沢市、所沢市、春日井市、四日市市など）なので、人口の多い順に、料金表が文字で載り、令和 8 年度と書かれ、第 2 子の決まりが今の形（free・free_same・half・half10・half100・table）に収まる市から足す。一般市も市民税の税率は 6% なので tax_adjust は要らない。見送った市と理由はこの reason に足していく
