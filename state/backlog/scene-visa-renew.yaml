title: 場面「在留期間を更新する」を足す
reason: 中長期在留者は在留期間の満了する日以前に更新を申請し、6 か月以上の在留期間なら満了の 3 か月前から受け付ける。手数料は 2026 年 10 月 1 日から許可期間に応じて 10,000 円から 75,000 円の 7 段階になった。出入国在留管理庁のページ（https://www.moj.go.jp/isa/applications/procedures/16-3.html）に期限と手数料の表が文字で載っていて、全国共通の事実として足せる。外国人の利用者に役立ち、5 言語で出す意味が大きい。手数料の表は許可期間を選ぶと額が出る形にするか、表のまま出すかを作るときに決める
