title: 場面「日本を一時的に出る」（外国籍の人）を足す
reason: 在留資格を持つ外国人は、出国の日から 1 年以内に戻るならみなし再入国許可で通常の再入国許可が要らない（「3月」以下の在留期間と「短期滞在」の人を除く）。それより長いときは出国する前に再入国許可を申請し、手数料は 4,000 円（1 回限り）か 7,000 円（数次）。出入国在留管理庁のページ（https://www.moj.go.jp/isa/immigration/procedures/16-5.html）に文字で載っていて、全国共通の事実として足せる。在留期間の更新の場面（scene-visa-renew）と同じ利用者に役立つ
