title: 政令指定都市をもう 1 つ足す
reason: 熊本市、北九州市、広島市、岡山市、静岡市、札幌市、千葉市、大阪市、相模原市、横浜市、さいたま市、堺市を足した。仙台市と新潟市は料金表が画像のため、福岡市は令和 8 年度の表が案のため見送った。次は料金表が文字で取れる市から足す（名古屋市は令和 8 年度の表が出たら、福岡市は案が外れたら）。神戸市は 0〜2 歳児の表で第 2 子の列が半額とも第 1 子と同じとも読めない階層（D1 の 10,300 円と 10,200 円）があるため見送った。浜松市は市のサイトで料金表を見つけられず、規則の別表は外部の例規集のサイトにあるため見送った。名古屋市は旧税率が 5.7% と資料にあるので、tax_adjust の比を資料どおりに書く。2026-11-15 に見直した: 名古屋市の令和 8 年度の利用のご案内に料金表は載っておらず、福岡市は料金表のページと子育てサイトの PDF の取得を拒まれる。足せる市が無いので点数を 11 に下げた。名古屋市の表か、福岡市の写しが取れるようになったら戻す
