title: 児童手当の月額の計算を足す
reason: 児童手当は令和 6 年 10 月分から所得制限が無くなり、月額は 3 歳未満が 15,000 円、3 歳から高校生年代までが 10,000 円、第 3 子以降が 30,000 円と、全国共通の表で決まる。こども家庭庁のページを出典にでき、市ごとの違いが無いので、保育料より確かめやすい。子どもの年齢と何人目かを入れると月額を出す計算を calc/ に足し、引っ越しの場面の児童手当の項目と、出生の場面（scene-birth）で使う。第 3 子の数え方（22 歳年度末までの子を数える）は出典の文をそのまま引用する
