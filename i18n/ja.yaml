st_hikazei: 非課税
st_seiho: 生活保護を受けている
tax: 市町村民税の所得割額（父母の合計、円）
tax_hint: 住民税の決定通知書に載っている額です。住宅ローン控除などの税額控除を引く前の額を使います。
child: 何人目の子か
