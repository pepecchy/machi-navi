age_note: 0 歳から 2 歳のクラスの金額です。3 歳から 5 歳のクラスは全国で無償です。
monthly: 月額の保育料
per: ／月
tier: 階層
source: 出典
checked: 確認日
rule_free: この市では、3 歳未満の第 2 子以降は無料です。
rule_free_same: この市では、保育所などを同時に利用している第 2 子以降は無料です。
rule_half: この市では、保育所などを同時に利用している第 2 子は半額です。
rule_half_any: この市では、きょうだいの年齢にかかわらず、第 2 子は半額です。
rule_half10_any: この市では、きょうだいの年齢にかかわらず、第 2 子は半額です（10 円未満は切り捨て）。
rule_free_all: ここでは、年齢やきょうだいにかかわらず、認可保育園などの基本保育料は無償です。
rule_half100: この市では、同時に利用している第 2 子は半額です（100 円未満は切り捨て）。
rule_half10: この市では、同時に利用している第 2 子は半額です（10 円未満は切り捨て）。
rule_table: この市では、第 2 子は市の料金表にある第 2 子の金額です。
rule_first: 第 1 子の金額です。第 2 子の扱いは市によって違います。上で切り替えて確かめられます。
rule_quote: "市の資料の文"
cmp_h: 同じ条件でほかの市と比べる
led_h: データの台帳
led_c1: 市区町村
led_c2: 公式の資料
led_c3: 階層の数
led_c4: 確認日
led_c5: 照合
led_ok: 一致
pending: "確認中"
badge: "試験公開"
cmp_p: "上の入力を、そのまま各市の料金表に当てはめた結果です。"
lead: "市を選ぶと、引っ越しのときにやることと、その市の料金表どおりの保育料が 1 か所で確かめられます。"
disclaimer: "目安です。実際の金額は市区町村の通知で決まります。ひとり親世帯などの軽減は扱っていません。"
led_p: "金額と期限は公式の資料から写し、出典と確認日を持たせています。公式の資料との照合が通ったものだけを載せています。"
