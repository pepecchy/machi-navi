who: あてはまるもの
who_child: 就学前の子どもがいる
who_foreign: 外国籍の人がいる
sc_h: 引っ越してきたときにやること
sc_p: 選んだ市の公式ページをもとにしたチェックリストです。期限のあるものから並べています。
calc_h: 保育料を計算する
calc_p: 住民税の所得割額を入れると、選んだ市の公式の料金表に当てはめた月額が出ます。
s_out: 前の市区町村に転出届を出す
s_out_due: 引っ越しの 30 日前から、引っ越し後 10 日以内
s_out_b: マイナンバーカードがあれば、マイナポータルからオンラインで出せます。前の市の窓口に行く必要は原則ありません。
s_in: 新しい市に転入届を出す
s_in_due: 住み始めてから 14 日以内
s_in_b: 転入届はオンラインでは出せません。窓口に行く必要があります。
s_za: 在留カードの住所を変える
s_za_due: 新しい住所に移った日から 14 日以内
s_za_b: 市区町村の窓口で在留カードを見せて届け出ます。転入届と同じ窓口でできます。
s_ji: 児童手当を新しい市に申請する
s_ji_due: 転出予定日の翌日から 15 日以内
s_ji_b: 期限を過ぎると、遅れた月の分は原則として受け取れません。
sb_h: 子どもが生まれたときにやること
sb_p: 全国共通の届け出です。生まれた日から数えます。
s_bn: 出生届を出す
s_bn_due: 生まれた日から 14 日以内（国外で生まれたときは 3 か月以内）
s_bn_b: 子の出生地、本籍地、届け出る人の住む市区町村の役所に出せます。
s_jb: 児童手当を申請する
s_jb_due: 生まれた日の翌日から 15 日以内
s_jb_b: 住んでいる市区町村に申請します。遅れると、遅れた月の分は原則として受け取れません。
s_ji_go: 児童手当の月額を計算する
s_kh: 国民健康保険に入る（会社などの健康保険に入っていない人）
s_kh_due: 住み始めてから 14 日以内
s_kh_b: 会社などの健康保険に入っている人とその扶養家族、生活保護を受けている人、後期高齢者医療制度の人は対象外です。
s_jb_go: 児童手当の月額を計算する
s_ik: 出産育児一時金を受け取る
s_ik_due: 子ども 1 人につき原則 500,000 円
s_ik_b: 入っている医療保険から出ます。直接支払制度を使うと病院などに直接払われ、窓口では残りの額だけを払います。申請の期限は出産日の翌日から 2 年以内です。
sd_h: 家族が亡くなったときにやること
sd_p: 全国共通の届け出です。期限は死亡を知った日から数えます。
s_dn: 死亡届を出す
s_dn_due: 死亡を知った日から 7 日以内（国外で亡くなったときは 3 か月以内）
s_dn_b: 亡くなった人の死亡地、本籍地、届け出る人の住む市区町村の役所に出せます。
s_dk: 国民健康保険をやめる（亡くなった人が国民健康保険に入っていたとき）
s_dk_due: 14 日以内
s_dk_b: 住んでいた市区町村の国民健康保険の窓口に届け出ます。
s_dp: 年金の死亡の手続きをする（亡くなった人が年金を受けていたとき）
s_dp_due: 年金は亡くなった月の分まで支払われます
s_dp_b: 受け取れなかった年金を受け取れる家族は、死亡の届けと一緒に請求できます。日本年金機構にマイナンバーが収録されている人は、死亡の届けだけなら原則として出さなくてかまいません。
sv_h: 在留期間を更新するときにやること（中長期在留者）
sv_p: 全国共通の手続きです。今の在留資格の活動を続けるときに申請します。
s_vr: 在留期間の更新を申請する
s_vr_due: 在留期間が満了する日まで（6 か月以上の在留期間なら満了の 3 か月前から）
s_vr_b: 住んでいる地域を受け持つ地方出入国在留管理官署に申請します。
s_vf: 許可されたら手数料を納める
s_vf_b: 手数料は許可を受ける在留期間で変わります。一定の要件を満たす人は減額か免除になり、減額後は許可期間にかかわらず 10,000 円です。
vf_c1: 許可を受ける在留期間
vf_c2: 手数料
vf_p1: 3 か月以下
vf_p2: 3 か月超 6 か月以下
vf_p3: 6 か月超 1 年未満
vf_p4: 1 年
vf_p5: 1 年超 3 年未満
vf_p6: 3 年以上 5 年未満
vf_p7: 5 年以上
sj_h: 会社を辞めたときにやること（すぐ次の会社に入らないとき）
sj_p: 全国共通の手続きです。会社の健康保険と厚生年金から抜けた後の切り替えです。
s_jk: 国民健康保険に入る（家族の健康保険の扶養に入らないとき）
s_jk_due: 14 日以内
s_jk_b: 住んでいる市区町村の国民健康保険の窓口に届け出ます。
s_jp: 国民年金の切り替えをする
s_jp_due: 辞めた日の翌日から切り替わります
s_jp_b: 次の会社に入らない間は第 1 号被保険者の手続きをし、国民年金保険料を納めます。配偶者の健康保険の扶養に入るときは第 3 号被保険者の手続きです。
sr_h: 日本を一時的に出るときにやること（在留資格のある人）
sr_p: 全国共通の手続きです。いつ戻るかで、要る手続きが変わります。
s_rm: 1 年以内に戻るなら、みなし再入国許可で出国する
s_rm_due: 出国の日から 1 年以内に戻るとき
s_rm_b: 有効な旅券を持つ人は、通常の再入国許可が要りません。在留期間が「3月」以下の人と「短期滞在」の人は使えません。
s_rp: それより長く出るなら、再入国許可を申請する
s_rp_due: 出国する前に。手数料は 4,000 円（1 回限り）か 7,000 円（数次）
s_rp_b: 手数料は許可されるときに収入印紙で納めます。
sc2_h: 在留カードの氏名や国籍が変わったときにやること（中長期在留者）
sc2_p: 全国共通の届け出です。結婚で氏名が変わったときなどに出します。
s_cc: 在留カードの記載事項の変更を届け出る
s_cc_due: 変わった日から 14 日以内
s_cc_b: 氏名、生年月日、性別、国籍・地域が変わったときに、地方出入国在留管理官署に届け出ます。手数料はかかりません。
s20_h: 20 歳になったときにやること
s20_p: 全国共通です。日本に住む 20 歳以上 60 歳未満の人は国民年金に入ります（厚生年金に入っている人を除く）。
s_tp: 届いた書類で国民年金の保険料を納めるか、免除や学生納付特例を申請する
s_tp_due: 20 歳になってから概ね 2 週間以内に書類が届きます
s_tp_b: 日本年金機構から、基礎年金番号通知書、保険料の納付書、免除・納付猶予・学生納付特例の申請書が届きます。
jc_h: 児童手当の月額を計算する
jc_p: 全国共通の表に当てはめた月額です。所得による制限はありません。
jc_u3: 3 歳未満の子
jc_hs: 3 歳から高校生年代までの子
jc_old: 高校を出た年代から 22 歳になった後の最初の 3 月 31 日までの子（親が生計費を負担している子）
jc_monthly: 月額の児童手当
jc_note: 第 3 子以降は、上の子から数えて 3 人目以降の子です。高校を出た年代の子は、手当は出ませんが数に入ります。
s_ho: 保育料を確かめる
s_ho_b: 保育料は市区町村ごとに違います。この市の料金表で計算できます。
s_ho_go: この市の保育料を計算する
s_ot: あてはまる人は、次の課でも手続きをする
l_window: 窓口
l_hours: 受付
l_wk: 月曜から金曜（祝日と年末年始を除く）
l_office: 市役所の開庁時間
l_bring: 持ち物
l_src: 出典
b_id: 本人確認書類
b_mynumber: マイナンバーカード
b_pin4: マイナンバーカードの暗証番号（数字 4 けた）
b_tensyutsu: 転出証明書（オンラインで転出届を出した人は不要）
b_nenkin: 国民年金手帳（第 1 号の加入者だけ）
b_zairyu: 在留カードまたは特別永住者証明書
o_kokuho: 国民健康保険、国民年金に入っている人
o_jido: こども医療、児童手当
o_school: 小学生、中学生がいる世帯
