who: Applies to you
who_child: I have a preschool child
who_foreign: Someone is a foreign national
sc_h: What to do when you move in
sc_p: A checklist based on the official pages of the city you chose. Items with deadlines come first.
calc_h: Calculate the daycare fee
calc_p: Enter your municipal income-based tax to get the monthly fee from the chosen city's official fee table.
s_out: File a moving-out notice with your previous city
s_out_due: From 30 days before to 10 days after the move
s_out_b: With a My Number Card you can file online through Mynaportal. In principle you do not need to visit the previous city's office.
s_in: File a moving-in notice with the new city
s_in_due: Within 14 days of starting to live there
s_in_b: The moving-in notice cannot be filed online. You must go to the office.
s_za: Update the address on your residence card
s_za_due: Within 14 days of moving to the new address
s_za_b: Show your residence card at the city office. You can do this at the same counter as the moving-in notice.
s_ji: Apply for child allowance in the new city
s_ji_due: Within 15 days from the day after your planned move-out date
s_ji_b: If you miss the deadline, you generally lose the allowance for the months you were late.
sb_h: What to do when your child is born
sb_p: These are the same everywhere in Japan. Count from the day of birth.
s_bn: Submit the birth notification
s_bn_due: Within 14 days from the day of birth (within 3 months if born abroad)
s_bn_b: You can submit it at the city office of the place of birth, the registered domicile, or where the person submitting lives.
s_jb: Apply for child allowance
s_jb_due: Within 15 days from the day after the birth
s_jb_b: Apply to the city where you live. If you are late, you generally lose the allowance for the months you were late.
s_ji_go: Calculate the monthly child allowance
s_kh: Join National Health Insurance (if you have no health insurance through work)
s_kh_due: Within 14 days of starting to live there
s_kh_b: People in a workplace health insurance and their dependents, people on public assistance, and people in the late-stage elderly medical care system are not covered.
s_jb_go: Calculate the monthly child allowance
s_ik: Receive the childbirth lump-sum grant
s_ik_due: In principle 500,000 yen per child
s_ik_b: Your health insurance pays it. With the direct payment system it goes straight to the hospital, and you pay only the rest at the counter. Apply within 2 years from the day after the birth.
sd_h: What to do when a family member dies
sd_p: These are the same everywhere in Japan. Deadlines count from the day you learn of the death.
s_dn: Submit the death notification
s_dn_due: Within 7 days of learning of the death (within 3 months if the death was abroad)
s_dn_b: You can submit it at the city office of the place of death, the registered domicile, or where the person submitting lives.
s_dk: Leave National Health Insurance (if the person who died was in it)
s_dk_due: Within 14 days
s_dk_b: Notify the National Health Insurance counter of the city where the person lived.
s_dp: Report the death for the pension (if the person who died received a pension)
s_dp_due: The pension is paid up to the month of death
s_dp_b: Family who can receive the unpaid pension can claim it together with the death report. If the person's My Number is on record with the Japan Pension Service, the death report alone is generally not needed.
sv_h: What to do when you renew your period of stay (mid- to long-term residents)
sv_p: This is the same everywhere in Japan. Apply when you keep doing the activity of your current status of residence.
s_vr: Apply to extend your period of stay
s_vr_due: By the day your period of stay ends (from 3 months before it ends if your period is 6 months or longer)
s_vr_b: Apply at the regional immigration services office that covers where you live.
s_vf: Pay the fee when it is granted
s_vf_b: The fee depends on the period of stay granted. People who meet certain conditions get a reduced fee or none; the reduced fee is 10,000 yen for any period.
vf_c1: Period of stay granted
vf_c2: Fee
vf_p1: 3 months or less
vf_p2: Over 3 months, up to 6 months
vf_p3: Over 6 months, under 1 year
vf_p4: 1 year
vf_p5: Over 1 year, under 3 years
vf_p6: 3 years or more, under 5 years
vf_p7: 5 years or more
sj_h: What to do when you leave your job (if you do not start a new job right away)
sj_p: These are the same everywhere in Japan. They switch you over after you leave the company's health insurance and employees' pension.
s_jk: Join National Health Insurance (if you do not become a dependent on a family member's insurance)
s_jk_due: Within 14 days
s_jk_b: Notify the National Health Insurance counter of the city where you live.
s_jp: Switch your National Pension
s_jp_due: It switches from the day after you leave
s_jp_b: Until you join a new company, do the procedure for a Category 1 insured person and pay the National Pension premiums. If you become a dependent on your spouse's health insurance, it is the Category 3 procedure.
jc_h: Calculate the monthly child allowance
jc_p: The monthly amount from the national table. There is no income limit.
jc_u3: Children under 3
jc_hs: Children from 3 to high-school age
jc_old: Children past high-school age, up to the first March 31 after turning 22, whose living costs you pay
jc_monthly: Monthly child allowance
jc_note: The third child or later means the third or later counting from the oldest. Children past high-school age get no allowance but are counted.
s_ho: Check the daycare fee
s_ho_b: Daycare fees differ by city. You can calculate with this city's fee table.
s_ho_go: Calculate this city's fee
s_ot: If these apply, also visit these sections
