who: Trường hợp của bạn
who_child: Có con chưa đi học tiểu học
who_foreign: Có người mang quốc tịch nước ngoài
sc_h: Việc cần làm khi chuyển đến
sc_p: Danh sách dựa trên trang chính thức của thành phố bạn chọn. Việc có thời hạn được xếp trước.
toc: Các tình huống trên trang này
calc_h: Tính phí nhà trẻ
calc_p: Nhập thuế thị dân tính theo thu nhập để có mức phí hàng tháng theo bảng phí chính thức của thành phố đã chọn.
s_out: Nộp thông báo chuyển đi ở nơi cũ
s_out_due: Từ 30 ngày trước đến 10 ngày sau khi chuyển
s_out_b: Nếu có thẻ My Number, bạn có thể nộp trực tuyến qua Mynaportal. Về nguyên tắc không cần đến quầy ở nơi cũ.
s_in: Nộp thông báo chuyển đến ở thành phố mới
s_in_due: Trong 14 ngày kể từ khi bắt đầu ở
s_in_b: Thông báo chuyển đến không nộp trực tuyến được. Bạn phải đến quầy.
s_za: Đổi địa chỉ trên thẻ lưu trú
s_za_due: Trong 14 ngày kể từ ngày chuyển đến địa chỉ mới
s_za_b: Xuất trình thẻ lưu trú tại quầy của thành phố. Có thể làm cùng quầy với thông báo chuyển đến.
s_ji: Đăng ký trợ cấp trẻ em ở thành phố mới
s_ji_due: Trong 15 ngày kể từ ngày sau ngày dự định chuyển đi
s_ji_b: Nếu quá hạn, về nguyên tắc bạn không nhận được trợ cấp của những tháng bị trễ.
sb_h: Việc cần làm khi con chào đời
sb_p: Đây là thủ tục chung trên toàn Nhật Bản. Tính từ ngày sinh.
s_bn: Nộp giấy khai sinh
s_bn_due: Trong 14 ngày kể từ ngày sinh (trong 3 tháng nếu sinh ở nước ngoài)
s_bn_b: Có thể nộp tại cơ quan hành chính nơi sinh, nơi đăng ký hộ tịch hoặc nơi người khai cư trú.
s_jb: Đăng ký trợ cấp trẻ em
s_jb_due: Trong 15 ngày kể từ ngày sau ngày sinh
s_jb_b: Đăng ký tại thành phố nơi bạn sống. Nếu trễ, về nguyên tắc bạn không nhận được trợ cấp của những tháng bị trễ.
s_ji_go: Tính trợ cấp trẻ em hằng tháng
s_kh: Tham gia Bảo hiểm Y tế Quốc dân (nếu không có bảo hiểm y tế qua công ty)
s_kh_due: Trong 14 ngày kể từ khi bắt đầu sống ở đó
s_kh_b: Người có bảo hiểm y tế của công ty và người phụ thuộc, người nhận trợ cấp sinh hoạt, người thuộc chế độ y tế cho người cao tuổi giai đoạn sau không thuộc diện này.
s_jb_go: Tính trợ cấp trẻ em hằng tháng
s_ik: Nhận trợ cấp sinh con một lần
s_ik_due: Về nguyên tắc 500,000 yên cho mỗi con
s_ik_b: Bảo hiểm y tế bạn tham gia sẽ chi trả. Nếu dùng chế độ thanh toán trực tiếp, tiền được trả thẳng cho bệnh viện và bạn chỉ trả phần còn lại tại quầy. Hạn nộp đơn là 2 năm kể từ ngày sau ngày sinh.
sd_h: Việc cần làm khi người thân qua đời
sd_p: Đây là thủ tục chung trên toàn Nhật Bản. Thời hạn tính từ ngày biết tin qua đời.
s_dn: Nộp giấy báo tử
s_dn_due: Trong 7 ngày kể từ ngày biết tin (trong 3 tháng nếu qua đời ở nước ngoài)
s_dn_b: Có thể nộp tại cơ quan hành chính nơi mất, nơi đăng ký hộ tịch hoặc nơi người khai cư trú.
s_dk: Rút khỏi Bảo hiểm Y tế Quốc dân (nếu người mất đã tham gia)
s_dk_due: Trong 14 ngày
s_dk_b: Báo cho quầy Bảo hiểm Y tế Quốc dân của thành phố nơi người mất đã sống.
s_dp: Làm thủ tục báo tử cho lương hưu (nếu người mất đang nhận lương hưu)
s_dp_due: Lương hưu được trả đến hết tháng qua đời
s_dp_b: Gia đình được nhận phần lương hưu chưa trả có thể yêu cầu cùng lúc với báo tử. Nếu Mã số cá nhân của người mất đã được lưu ở Cơ quan Hưu trí Nhật Bản, về nguyên tắc không cần nộp riêng báo tử.
sv_h: Việc cần làm khi gia hạn thời gian lưu trú (người cư trú trung và dài hạn)
sv_p: Đây là thủ tục chung trên toàn Nhật Bản. Nộp đơn khi bạn tiếp tục hoạt động theo tư cách lưu trú hiện tại.
s_vr: Nộp đơn gia hạn thời gian lưu trú
s_vr_due: Trước ngày hết hạn lưu trú (nếu thời gian lưu trú từ 6 tháng trở lên thì từ 3 tháng trước khi hết hạn)
s_vr_b: Nộp tại Cục Quản lý Xuất nhập cảnh và Lưu trú khu vực phụ trách nơi bạn sống.
s_vf: Nộp lệ phí khi được cấp phép
s_vf_b: Lệ phí tùy theo thời gian lưu trú được cấp. Người đáp ứng điều kiện nhất định được giảm hoặc miễn; lệ phí sau khi giảm là 10,000 yên cho mọi thời hạn.
vf_c1: Thời gian lưu trú được cấp
vf_c2: Lệ phí
vf_p1: Từ 3 tháng trở xuống
vf_p2: Trên 3 tháng đến 6 tháng
vf_p3: Trên 6 tháng, dưới 1 năm
vf_p4: 1 năm
vf_p5: Trên 1 năm, dưới 3 năm
vf_p6: Từ 3 năm đến dưới 5 năm
vf_p7: Từ 5 năm trở lên
sj_h: Việc cần làm khi nghỉ việc (nếu không vào công ty mới ngay)
sj_p: Đây là thủ tục chung trên toàn Nhật Bản. Đây là việc chuyển đổi sau khi rời bảo hiểm y tế và hưu trí phúc lợi của công ty.
s_jk: Tham gia Bảo hiểm Y tế Quốc dân (nếu không thành người phụ thuộc trong bảo hiểm của gia đình)
s_jk_due: Trong 14 ngày
s_jk_b: Báo cho quầy Bảo hiểm Y tế Quốc dân của thành phố nơi bạn sống.
s_jp: Chuyển đổi Lương hưu Quốc dân
s_jp_due: Chuyển đổi từ ngày sau ngày nghỉ việc
s_jp_b: Trong thời gian chưa vào công ty mới, làm thủ tục người được bảo hiểm loại 1 và đóng phí Lương hưu Quốc dân. Nếu thành người phụ thuộc trong bảo hiểm y tế của vợ hoặc chồng thì làm thủ tục loại 3.
s_jo: Khai báo về cơ quan trực thuộc (người có tư cách lưu trú lao động)
s_jo_due: Trong 14 ngày kể từ ngày hết hợp đồng
s_jo_b: Người có tư cách như Kỹ thuật/Tri thức nhân văn/Nghiệp vụ quốc tế phải khai báo với Cục Quản lý Xuất nhập cảnh khi hợp đồng với công ty kết thúc do chuyển việc hoặc nghỉ việc, và khi ký với công ty mới.
sr_h: Việc cần làm khi tạm rời Nhật Bản (người có tư cách lưu trú)
sr_p: Đây là thủ tục chung trên toàn Nhật Bản. Thủ tục cần thiết tùy theo khi nào bạn quay lại.
s_rm: Nếu quay lại trong 1 năm, xuất cảnh bằng giấy phép tái nhập cảnh đặc biệt
s_rm_due: Khi quay lại trong 1 năm kể từ ngày xuất cảnh
s_rm_b: Người có hộ chiếu còn hiệu lực không cần giấy phép tái nhập cảnh thông thường. Người có thời gian lưu trú từ 3 tháng trở xuống và người có tư cách Lưu trú ngắn hạn không dùng được.
s_rp: Nếu đi lâu hơn, nộp đơn xin giấy phép tái nhập cảnh
s_rp_due: Trước khi xuất cảnh. Lệ phí 4,000 yên (một lần) hoặc 7,000 yên (nhiều lần)
s_rp_b: Nộp lệ phí bằng tem thu nhập khi được cấp phép.
sc2_h: Việc cần làm khi tên hoặc quốc tịch trên thẻ lưu trú thay đổi (người cư trú trung và dài hạn)
sc2_p: Đây là thủ tục chung trên toàn Nhật Bản. Ví dụ nộp khi đổi tên do kết hôn.
s_cc: Khai báo thay đổi nội dung trên thẻ lưu trú
s_cc_due: Trong 14 ngày kể từ ngày thay đổi
s_cc_b: Khi tên, ngày sinh, giới tính hoặc quốc tịch/khu vực thay đổi, khai báo tại Cục Quản lý Xuất nhập cảnh và Lưu trú khu vực. Không mất phí.
s20_h: Việc cần làm khi tròn 20 tuổi
s20_p: Áp dụng chung trên toàn Nhật Bản. Người sống ở Nhật từ 20 đến dưới 60 tuổi tham gia Lương hưu Quốc dân (trừ người tham gia hưu trí phúc lợi).
s_tp: Đóng phí Lương hưu Quốc dân bằng giấy tờ nhận được, hoặc xin miễn hay hoãn đóng cho sinh viên
s_tp_due: Giấy tờ đến trong khoảng 2 tuần sau khi tròn 20 tuổi
s_tp_b: Cơ quan Hưu trí Nhật Bản gửi thông báo số lương hưu cơ bản, phiếu nộp phí và đơn xin miễn, hoãn và hoãn đóng cho sinh viên.
jc_h: Tính trợ cấp trẻ em hằng tháng
jc_p: Số tiền hằng tháng theo bảng chung toàn quốc. Không có giới hạn thu nhập.
jc_u3: Con dưới 3 tuổi
jc_hs: Con từ 3 tuổi đến tuổi học cấp 3
jc_old: Con đã qua tuổi học cấp 3, đến ngày 31 tháng 3 đầu tiên sau khi tròn 22 tuổi, do cha mẹ chi trả sinh hoạt phí
jc_monthly: Trợ cấp trẻ em hằng tháng
jc_note: Con thứ 3 trở đi là con thứ 3 trở đi tính từ con lớn nhất. Con đã qua tuổi học cấp 3 không được trợ cấp nhưng vẫn được tính.
s_ho: Kiểm tra phí nhà trẻ
s_ho_b: Phí nhà trẻ khác nhau theo thành phố. Bạn có thể tính theo bảng phí của thành phố này.
s_ho_go: Tính phí của thành phố này
s_ot: Nếu thuộc các trường hợp sau, hãy làm thủ tục ở các phòng này
l_window: Quầy
l_hours: Giờ tiếp nhận
l_wk: Thứ Hai đến thứ Sáu (trừ ngày lễ và dịp cuối năm, đầu năm)
l_office: Giờ mở cửa của tòa thị chính
l_bring: Mang theo
l_src: Nguồn
b_id: Giấy tờ xác nhận danh tính
b_mynumber: Thẻ My Number
b_pin4: Mã PIN thẻ My Number (4 chữ số)
b_tensyutsu: Giấy chứng nhận chuyển đi (không cần nếu đã nộp trực tuyến)
b_nenkin: Sổ lương hưu quốc dân (chỉ người tham gia loại 1)
b_zairyu: Thẻ lưu trú hoặc giấy chứng nhận vĩnh trú đặc biệt
o_kokuho: Người tham gia bảo hiểm y tế quốc dân, lương hưu quốc dân
o_jido: Trợ cấp y tế trẻ em, trợ cấp trẻ em
o_school: Hộ có học sinh tiểu học, trung học cơ sở
h1: Chọn thành phố bạn sống để biết việc cần làm và chi phí
city: Thành phố
status: Thuế cư trú của hộ gia đình
st_tax: Có thuế tính theo thu nhập
st_kinto: Chỉ có thuế cố định
st_hikazei: Miễn thuế cư trú
st_seiho: Đang nhận trợ cấp sinh hoạt
tax: Thuế thị dân tính theo thu nhập (tổng của bố mẹ, yên)
tax_hint: Ghi trên giấy thông báo thuế cư trú. Dùng số tiền trước khi trừ các khoản khấu trừ thuế như vay mua nhà.
child: Con thứ mấy
child1: Con thứ nhất
child2: Con thứ hai
hours: Thời gian giữ trẻ
std: Tiêu chuẩn (tối đa 11 giờ)
short: Ngắn (tối đa 8 giờ)
age_note: Mức phí cho lớp 0 đến 2 tuổi. Lớp 3 đến 5 tuổi được miễn phí trên toàn quốc.
monthly: Phí nhà trẻ hàng tháng
per: / tháng
tier: Bậc
source: Nguồn
checked: Ngày kiểm tra
rule_free: Ở thành phố này, con thứ hai trở đi dưới 3 tuổi được miễn phí.
rule_free_same: Ở thành phố này, con thứ hai trở đi đi nhà trẻ cùng lúc được miễn phí.
rule_half: Ở thành phố này, con thứ hai đi nhà trẻ cùng lúc trả một nửa.
rule_half_any: Ở thành phố này, con thứ hai trả một nửa, không kể tuổi của anh chị.
rule_half10_any: Ở thành phố này, con thứ hai trả một nửa, không kể tuổi của anh chị (làm tròn xuống 10 yên).
rule_free_all: Ở đây, phí cơ bản tại nhà trẻ được cấp phép miễn phí cho mọi trẻ, không kể tuổi hay anh chị em.
rule_half100: Ở thành phố này, con thứ hai đi nhà trẻ cùng lúc trả một nửa (làm tròn xuống 100 yên).
rule_half10: Ở thành phố này, con thứ hai đi nhà trẻ cùng lúc trả một nửa (làm tròn xuống 10 yên).
rule_table: Ở thành phố này, con thứ hai trả mức dành cho con thứ hai trong bảng phí của thành phố.
rule_first: Đây là mức phí cho con thứ nhất. Quy định cho con thứ hai khác nhau theo thành phố. Hãy đổi ở trên để xem.
rule_quote: "Nguyên văn trong tài liệu của thành phố (tiếng Nhật)"
cmp_h: So sánh với các thành phố khác theo cùng điều kiện
led_h: Sổ dữ liệu
led_c1: Thành phố
led_c2: Tài liệu chính thức
led_c3: Số bậc
led_c4: Ngày kiểm tra
led_c5: Đối chiếu
led_ok: Khớp
pending: "Đang kiểm tra lại"
badge: "Thử nghiệm"
cmp_p: "Kết quả áp dụng cùng dữ liệu nhập ở trên vào bảng phí của từng thành phố."
lead: "Chọn thành phố để xem ở một nơi: việc cần làm khi chuyển đến và phí nhà trẻ theo bảng phí của thành phố đó."
disclaimer: "Đây là mức tham khảo. Số tiền thực tế do thông báo của thành phố quyết định. Không bao gồm các mức giảm như cho hộ cha hoặc mẹ đơn thân."
led_p: "Số tiền và thời hạn được chép từ tài liệu chính thức, kèm nguồn và ngày kiểm tra. Chỉ đăng những mục khớp với tài liệu chính thức."
foot: "Số tiền và thời hạn được chép từ tài liệu chính thức của từng thành phố và của nhà nước. Nội dung ngoài tiếng Nhật là bản dịch máy, chưa được người kiểm tra."
home: "Hãy chọn ngôn ngữ và thành phố"
adjust_note: "Thành phố này xác định bậc theo số thuế trên thông báo nhân với {ratio}. Hãy nhập đúng số tiền ghi trên thông báo."
