lead: "选择城市后，可在一处确认搬来时要办的事，以及按该市收费表计算的保育费。"
disclaimer: "仅供参考。实际金额以市区町村的通知为准。不包含单亲家庭等的减免。"
led_p: "金额和期限抄自官方资料，并附有出处和确认日期。只刊登与官方资料核对一致的内容。"
