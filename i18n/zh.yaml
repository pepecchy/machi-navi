who: 符合的情况
who_child: 有学龄前儿童
who_foreign: 有外国籍成员
sc_h: 搬来时要办的事
sc_p: 根据所选城市的官方网页整理的清单。有期限的排在前面。
calc_h: 计算保育费
calc_p: 输入住民税的所得割额，即可得到按所选城市官方收费表计算的月额。
s_out: 向原市区町村提交迁出申报
s_out_due: 搬家前 30 天至搬家后 10 天内
s_out_b: 有个人编号卡的话，可通过 Mynaportal 在线提交，原则上不必去原城市的窗口。
s_in: 向新城市提交迁入申报
s_in_due: 开始居住后 14 天内
s_in_b: 迁入申报不能在线办理，必须去窗口。
s_za: 变更在留卡上的住址
s_za_due: 迁到新住址之日起 14 天内
s_za_b: 在市区町村窗口出示在留卡办理，可与迁入申报在同一窗口办理。
s_ji: 向新城市申请儿童补贴
s_ji_due: 预定迁出日的次日起 15 天内
s_ji_b: 超过期限的话，原则上无法领取延误月份的补贴。
sb_h: 孩子出生时要办的事
sb_p: 这些是全国统一的手续。从出生当天算起。
s_bn: 提交出生申报
s_bn_due: 出生之日起 14 天内（在国外出生时为 3 个月内）
s_bn_b: 可在孩子的出生地、户籍地或申报人居住地的市区町村政府提交。
s_jb: 申请儿童补贴
s_jb_due: 出生次日起 15 天内
s_jb_b: 向居住地的市区町村申请。延误的话，原则上无法领取延误月份的补贴。
s_ji_go: 计算儿童补贴的月额
s_kh: 加入国民健康保险（没有通过公司等加入健康保险的人）
s_kh_due: 开始居住后 14 天内
s_kh_b: 已加入公司等健康保险的人及其被扶养家属、领取生活保护的人、加入后期高龄者医疗制度的人不在此列。
s_jb_go: 计算儿童补贴的月额
s_ik: 领取生育一次性补助金
s_ik_due: 每个孩子原则上 500,000 日元
s_ik_b: 由所加入的医疗保险支付。使用直接支付制度时直接付给医院等，窗口只需支付剩余金额。申请期限为分娩次日起 2 年内。
sd_h: 家人去世时要办的事
sd_p: 这些是全国统一的手续。期限从得知死亡之日算起。
s_dn: 提交死亡申报
s_dn_due: 得知死亡之日起 7 天内（在国外去世时为 3 个月内）
s_dn_b: 可在死者的死亡地、户籍地或申报人居住地的市区町村政府提交。
s_dk: 退出国民健康保险（死者加入了国民健康保险时）
s_dk_due: 14 天内
s_dk_b: 向死者居住的市区町村的国民健康保险窗口申报。
s_dp: 办理年金的死亡手续（死者领取年金时）
s_dp_due: 年金支付到死亡当月为止
s_dp_b: 可领取未支付年金的家属，可在提交死亡申报时一并申请。日本年金机构已登记个人编号的人，仅死亡申报原则上无需提交。
sv_h: 更新在留期间时要办的事（中长期在留者）
sv_p: 这是全国统一的手续。继续从事现有在留资格的活动时申请。
s_vr: 申请更新在留期间
s_vr_due: 在留期间届满之日前（在留期间为 6 个月以上时，可从届满前 3 个月起申请）
s_vr_b: 向管辖居住地的地方出入国在留管理官署申请。
s_vf: 获得许可后缴纳手续费
s_vf_b: 手续费因获准的在留期间而不同。符合一定条件的人可减免，减免后不论许可期间均为 10,000 日元。
vf_c1: 获准的在留期间
vf_c2: 手续费
vf_p1: 3 个月以下
vf_p2: 超过 3 个月、6 个月以下
vf_p3: 超过 6 个月、未满 1 年
vf_p4: 1 年
vf_p5: 超过 1 年、未满 3 年
vf_p6: 3 年以上、未满 5 年
vf_p7: 5 年以上
sj_h: 辞职时要办的事（不马上进入下一家公司时）
sj_p: 这些是全国统一的手续。是退出公司的健康保险和厚生年金后的切换。
s_jk: 加入国民健康保险（不成为家人健康保险的被扶养人时）
s_jk_due: 14 天内
s_jk_b: 向居住地的市区町村的国民健康保险窗口申报。
s_jp: 办理国民年金的切换
s_jp_due: 从辞职次日起切换
s_jp_b: 不进入下一家公司期间，办理第 1 号被保险人的手续并缴纳国民年金保险费。成为配偶健康保险的被扶养人时，办理第 3 号被保险人的手续。
sr_h: 暂时离开日本时要办的事（有在留资格的人）
sr_p: 这些是全国统一的手续。所需手续因何时回来而不同。
s_rm: 1 年内回来时，以视为再入国许可出境
s_rm_due: 自出境之日起 1 年内回来时
s_rm_b: 持有效护照的人不需要普通的再入国许可。在留期间为「3个月」以下的人和「短期滞在」的人不能使用。
s_rp: 离开更久时，申请再入国许可
s_rp_due: 出境前。手续费为 4,000 日元（一次）或 7,000 日元（多次）
s_rp_b: 获得许可时用收入印花缴纳手续费。
jc_h: 计算儿童补贴的月额
jc_p: 按全国统一的表计算的月额。没有收入限制。
jc_u3: 未满 3 岁的孩子
jc_hs: 3 岁到高中年龄的孩子
jc_old: 高中毕业年龄起、到满 22 岁后的第一个 3 月 31 日为止的孩子（由父母负担生活费）
jc_monthly: 每月的儿童补贴
jc_note: 第 3 个及以后的孩子，是从最大的孩子数起的第 3 个及以后。高中毕业年龄的孩子不领补贴，但计入人数。
s_ho: 确认保育费
s_ho_b: 保育费因市区町村而异，可用该市的收费表计算。
s_ho_go: 计算该市的保育费
s_ot: 符合以下情况的人，还需到这些部门办理
l_window: 窗口
l_hours: 受理时间
l_wk: 周一至周五（节假日和年末年初除外）
l_office: 市政府办公时间
l_bring: 携带物品
l_src: 出处
b_id: 本人确认证件
b_mynumber: 个人编号卡
b_pin4: 个人编号卡密码（4 位数字）
b_tensyutsu: 迁出证明（在线提交迁出申报的人不需要）
b_nenkin: 国民年金手册（仅第 1 号参保人）
b_zairyu: 在留卡或特别永住者证明书
o_kokuho: 参加国民健康保险、国民年金的人
o_jido: 儿童医疗、儿童补贴
o_school: 有小学生、初中生的家庭
h1: 选择居住的城市，了解要办的事和费用
city: 市区町村
status: 家庭的住民税
st_tax: 有所得割课税
st_kinto: 只有均等割课税
st_hikazei: 非课税
st_seiho: 领取生活保护
tax: 市町村民税所得割额（父母合计，日元）
tax_hint: 见住民税决定通知书。使用扣除住房贷款等税额扣除之前的金额。
child: 第几个孩子
child1: 第一个孩子
child2: 第二个孩子
hours: 保育时间
std: 标准时间（最长 11 小时）
short: 短时间（最长 8 小时）
age_note: 0 至 2 岁班的金额。3 至 5 岁班全国免费。
monthly: 每月保育费
per: ／月
tier: 阶层
source: 出处
checked: 确认日期
rule_free: 该市 3 岁以下的第二个及以后的孩子免费。
rule_free_same: 该市同时入托的第二个及以后的孩子免费。
rule_half: 该市同时入托的第二个孩子半价。
rule_half_any: 该市不论哥哥姐姐的年龄，第二个孩子半价。
rule_half10_any: 该市不论哥哥姐姐的年龄，第二个孩子半价（不足 10 日元舍去）。
rule_free_all: 这里不论年龄和兄弟姐妹，认可保育园等的基本保育费全部免费。
rule_half100: 该市同时入托的第二个孩子半价（不足 100 日元舍去）。
rule_half10: 该市同时入托的第二个孩子半价（不足 10 日元舍去）。
rule_table: 该市第二个孩子按市收费表中第二个孩子的金额收费。
rule_first: 这是第一个孩子的金额。第二个孩子的规定因市而异，可在上方切换查看。
rule_quote: "市资料中的原文（日语）"
cmp_h: 用相同条件与其他城市比较
led_h: 数据台账
led_c1: 市区町村
led_c2: 官方资料
led_c3: 阶层数
led_c4: 确认日期
led_c5: 核对
led_ok: 一致
pending: "确认中"
badge: "试运行"
