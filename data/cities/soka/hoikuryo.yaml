id: soka-hoikuryo
fiscal_year: 2026
doc: 保育所等の利用者負担額(2号・3号認定)
source: https://www.city.soka.saitama.jp/cont/s1603/020/010/010/02.html
checked: 2026-11-16
quotes:
  - "令和8年4月から令和8年8月までの保育料は令和7年度市区町村民税額で、令和8年9月から令和9年3月までの保育料は令和8年度市区町村民税額に基づいて算定します。"
  - "小学校就学前の子どもが下記の対象施設に2人以上入所する場合、第2子の保育料が半額、第3子以降の保育料が無料。"
  - "市区町村民税所得割額が5万7,700円未満の世帯の場合、第1子の年齢にかかわらず、第2子は半額、第3子以降は無料。"
wording: [rule_half]
second_child: half
# Which entry of quotes states the second-child rule (0 = first). Below 57,700 yen the second child is half whatever the first child's age.
second_child_quote: 1
