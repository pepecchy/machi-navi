doc: 令和8年度保育料・給食費
source: https://www.city.kariya.lg.jp/kosodatenavi/1014910/1011895/1015435/1015449.html
checked: 2026-11-15
quotes:
  - "令和8年度保育料の4月分から8月分は令和7年度の市町村民税額によって、9月分以降は令和8年度の市町村民税額により決定しますので、保育料は9月分から変更になることがあります。"
  - "「18歳未満の児童で数えて2番目」である場合は、上記基準額の規定にかかわらず、保育料は無料になります。"
