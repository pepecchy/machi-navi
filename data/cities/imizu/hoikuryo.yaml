  - "4 生計を同一にする世帯に現に2人以上の子がいる場合において、戸籍上第2子以降の児童(養子縁組、死亡等により"
  - "除籍された者は除く。)が入園しているときは、当該児童の保育料は無料となります。ただし、市長が必要と認める"
  - "において、保育料が半額となります。(表には軽減後の額を記載しています。)"
