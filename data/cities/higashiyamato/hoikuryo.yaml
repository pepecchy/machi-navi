id: higashiyamato-hoikuryo
fiscal_year: 2026
doc: "保育料(利用者負担額)"
source: https://www.city.higashiyamato.lg.jp/kosodatekyoiku/hoiku/1003257/1003266.html
checked: 2026-11-15
quotes:
  - "3号認定:お子さんが満3歳未満で保育が必要であり、保育所、認定こども園、地域型保育(保育ママ、小規模保育、事業所内保育、居宅訪問型保育)を利用される方の保育料は無償となります"
  - "その負担部分を東京都が負担することにより、保育料を無償化しております"
wording: [rule_free_all]
# The basic fee is waived for every child, so the ward publishes no tier amounts.
free_all: true
second_child: free
# Which entry of quotes states the rule (0 = first).
second_child_quote: 0
