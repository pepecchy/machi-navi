id: sapporo-hoikuryo
fiscal_year: 2026
doc: 認可保育所、認定こども園（保育所部分）、地域型保育事業所を利用される保護者のみなさまへ（令和8年4月発行）
source: https://kosodate.city.sapporo.jp/material/files/group/1/hoikuryou2026ketteihouhou.pdf
checked: 2026-11-15
quotes:
  - "兄又は姉がいる場合、きょうだいの保育所等の利用状況に関わらず保育料がかかりません"
  - "旧税率(6%)により計算された所得割を使用します"
  - "書類に記載されている所得割に 6/8 を乗じることで"
  - "所得割が非課税で、均等割のみ課税されている世帯はC階層に該当します"
wording: [rule_free, adjust_note]
second_child: free
# Which entry of quotes states the second-child rule (0 = first).
second_child_quote: 0
# The city levies 8%; the fee table is read at the former 6% rate, so the tax on the notice is multiplied by 6/8.
