fiscal_year: 2026
doc: 令和8年度の利用者負担額(0~2歳児)について(令和8年9月1日から適用)
source: https://www.city.sagamihara.kanagawa.jp/_res/projects/default_project/_page_/001/006/707/r08_2futan0.pdf
checked: 2026-11-15
quotes:
  - "第2子の児童は基準額表の「2人目」の金額となり"
  - "指定都市(相模原市、横浜市、川崎市など)が市民税額を決定している場合、市民税額等に6/8を乗じて算出した額を基に決定します"
wording: [rule_half, adjust_note]
# The "2人目" column is exactly half of the first-child amount.
second_child: half
# Which entry of quotes states the second-child rule (0 = first).
second_child_quote: 0
# The city levies 8%; the tiers are decided on the tax multiplied by 6/8.
