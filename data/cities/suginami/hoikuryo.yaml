id: suginami-hoikuryo
fiscal_year: 2026
doc: "認可保育所・地域型保育事業の保育料について"
source: https://www.city.suginami.tokyo.jp/guide/kosodate/navi/hoikuryou/1019291.html
checked: 2026-11-15
quotes:
  - "以下の児童につきましては、令和7年8月以前に無償化済みです"
  - "3~5歳児クラス"
  - "0~2歳児クラス(住民税非課税世帯)"
  - "0~2歳児クラス(住民税課税世帯)の第2子以降"
  - "令和7年9月から保育料等第1子無償化を実施し、認可保育所・地域型保育事業を利用する0~2歳児クラス(課税世帯)第1子の保育料について、所得階層に関わらず無料といたします"
wording: [rule_free_all]
# The basic fee is waived for every child, so the ward publishes no tier amounts.
free_all: true
second_child: free
