# The table prints the free-from-the-second-child rule across a vertical caption; the city page that links the table states it in one sentence.
rule_source: https://www.city.kanonji.kagawa.jp/soshiki/17/882.html
rule_doc: 保育施設への入所
rule_quotes:
  - "令和8年4月から、観音寺市独自の子育て支援として、生計を同一にする世帯で現に扶養している子どもが2人以上いる場合、第1子の年齢や保護者の所得に関係なく第2子以降の保育料・給食費は無料になりました。"
wording: [rule_free]
second_child: free
# Which entry of rule_quotes states the second-child rule (0 = first).
