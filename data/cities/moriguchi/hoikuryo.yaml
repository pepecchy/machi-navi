quotes:
  - "令和8年(2026 年)度"
  - "守口市では、世帯の所得に関わらず市内に住む全ての0歳から5歳児までの認定こども園・保育所・幼稚園・地域型保育事業(小規模保育事業や事業所内保育事業等)の利用者負担額が無料"
