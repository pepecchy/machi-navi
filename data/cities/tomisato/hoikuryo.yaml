quotes:
  - "令和8年度 富里市利用者負担額(保育料)月額表"
  - "C階層からD階層までにおける同一世帯から2人以上の就学前児童が保育所、幼稚園、認定こども園若しくは特別支援学校幼稚部に在籍している場合、情緒障害児短期治療施設通所部に通っている場合又は児童発達支援若しくは医療型児童発達支援を利用している場合において、第2子以降については無料とします。"
  - "ひとり親世帯等以外の世帯のうち、市民税所得割額が57,700円未満の世帯については、年齢に関わらず、生計を一にしている子のうち、最も年長の子から順にカウントし、第2子以降については無料とします。"
wording: [rule_free_same]
