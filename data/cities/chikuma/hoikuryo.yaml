rule_quotes:
  - "千曲市では、令和5年度まで市独自の3歳未満児の保育料軽減施策として第2子以降半額を実施してまいりましたが、新たに令和6年4月から長野県と連携し、さらなる子育て世帯の経済的負担の軽減を図るため、下記の内容で保育料軽減事業を拡充いたします。"
