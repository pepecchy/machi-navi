rule_doc: 保育料の決定方法について(教育・保育給付認定1号および2・3号認定)
rule_quotes:
  - "2人以上の児童が認可保育所、幼稚園、認定こども園、小規模保育事業所または企業主導型保育事業所等で保育を受けている場合、2人目で認可保育施設、認定こども園(保育部分)、家庭的保育事業等で保育を受けている児童の保育料の月額は、基準額の2分の1となります"
