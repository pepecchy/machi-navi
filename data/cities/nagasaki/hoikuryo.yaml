  - "ただし、市民税所得割課税額 97,000 円未満(D1 階層以下)の世帯は、同一世帯の最年長の子ども(概ね満 18 歳までの子ども)から数えて、2人目以降は0円とします"
wording: [rule_free_same]
# The second child enrolled at the same time is 0 yen in every tier; in D1 and below an older sibling up to about 18 also counts.
