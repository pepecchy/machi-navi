id: shinjuku-hoikuryo
fiscal_year: 2026
doc: 認可保育園等を利用する全てのお子さんの基本保育料は無償です
source: https://www.city.shinjuku.lg.jp/kodomo/hoiku01_000002.html
checked: 2026-11-15
quotes:
