doc: 転入届：本人または新しく同じ世帯になる方が手続きをするとき
source: https://www.city.shizuoka.lg.jp/s8436/s013642.html
quotes:
  - 14日以内に区役所窓口で転入の手続きが必要です
  - 葵区役所戸籍住民課(葵区役所1階 窓口)
  - 駿河区役所戸籍住民課(駿河区役所1階 窓口)
  - 清水区役所戸籍住民課(清水区役所1階 窓口)
  - 月曜日から金曜日(祝日・年末年始を除く) 午前8時45分から午後4時45分
  - 注記:マイナンバーカードによる転出手続きをされた方は不要です。
  - お越しになる方の本人確認を行いますので、本人確認書類(運転免許証など)をお持ちください
  - 在留カードまたは特別永住者証明書(外国人の方)
