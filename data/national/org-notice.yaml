id: org-notice
values: [14]
unit: days
doc: 所属（契約）機関に関する届出（出入国在留管理庁）
source: https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri10_00015.html
quotes:
  - 契約機関(会社など)が名称や所在地を変更した場合、消滅した場合、契約機関との契約が終了した場合(注1)、新たな契約を締結した場合(注2)は、14日以内に
  - (注1)転職、退職などにより、契約機関との契約が終了した場合のことです。
  - 研究、技術・人文知識・国際業務、介護、興行
  - 上記の事由が生じた日から14日以内
checked: 2026-11-20
