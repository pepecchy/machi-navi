id: visa-renew-fee
values: [10000, 18000, 25000, 33000, 48000, 64000, 75000]
unit: yen
doc: 在留期間更新許可申請（出入国在留管理庁）
source: https://www.moj.go.jp/isa/applications/procedures/16-3.html
quotes:
  - 許可を受ける在留期間に応じて手数料額が異なります。
  - 3月以下 10,000円
  - 3月超6月以下 18,000円
  - 6月超1年未満 25,000円
  - 1年 33,000円
  - 1年超3年未満 48,000円
  - 3年以上5年未満 64,000円
  - 5年以上 75,000円
  - 一定の要件を満たす者については、手数料が減額又は免除される場合があります。減額後の手数料は、許可期間にかかわらず10,000円です。
checked: 2026-11-20
