id: card-renew
values: [3]
unit: months
doc: 在留カードの有効期間の更新申請（出入国在留管理庁）
source: https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri10_00011.html
quotes:
  - 永住者(16歳以上に限る。)又は高度専門職2号 現に有する在留カードの有効期間の満了日の3か月前から有効期間の満了日まで
  - 在留カード(2026年6月13日までに交付されたものに限る。)の有効期間の満了日が16歳の誕生日又はその前日とされている者 当該16歳の誕生日又はその前日の6か月前から有効期間の満了日まで
  - 手数料はかかりません
checked: 2026-11-20
