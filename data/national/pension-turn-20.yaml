id: pension-turn-20
values: [2]
unit: weeks
doc: 20歳になったとき（日本年金機構）
source: https://www.nenkin.go.jp/service/kokunen/kanyu/hatachi-tetsuduki.html
quotes:
  - 日本国内に居住している20歳以上60歳未満の方は、国民年金の被保険者(加入者)となります。
  - 20歳になった方には、日本年金機構から国民年金( 第1号被保険者 )に加入したことをお知らせします。 ※厚生年金保険に加入している方を除きます。
  - 20歳になってから概ね2週間以内に「基礎年金番号通知書」
  - 保険料の免除・納付猶予制度と学生納付特例制度の申請書、返信用封筒が送付されます。
