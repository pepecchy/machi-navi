id: pension-job-leave
values: []
unit: none
doc: 会社を退職したときの国民年金の手続き（日本年金機構）
source: https://www.nenkin.go.jp/service/kokunen/kanyu/20140710-03.html
quotes:
  - 退職し、しばらく次の会社に入らない場合や自営業者等になった場合には、その期間は国民年金 第1号被保険者 の手続きを行い、国民年金保険料を納める必要があります。
  - 退職して配偶者が加入する健康保険の被扶養者となる場合には、国民年金 第3号被保険者 の手続きを行います。
  - 例:4月15日に会社をやめ、4月16日からは会社に就職しない場合
checked: 2026-11-20
