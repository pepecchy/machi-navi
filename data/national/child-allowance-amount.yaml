id: child-allowance-amount
values: [15000, 10000, 30000]
unit: yen_month
doc: 児童手当制度のご案内（こども家庭庁）
source: https://www.cfa.go.jp/policies/kokoseido/jidouteate/annai
quotes:
  - 3歳未満 15,000円(第3子以降は30,000円)
  - 3歳以上 高校生年代まで 10,000円(第3子以降は30,000円)
  - ※「第3子以降」とは、児童及び児童の兄姉等のうち、年齢が上の子から数えて3人目以降の子のことをいいます。
  - 18歳に達する日以後の最初の3月31日を経過した後の22歳に達する日以後の最初の3月31日までの間にあって親等に経済的負担のある子
